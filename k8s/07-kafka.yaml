# Single-broker Kafka in KRaft mode.
#
# This is a learning/dev deployment. Running Kafka properly on Kubernetes
# means the Strimzi operator: it handles broker identity, storage, rolling
# upgrades, partition rebalancing and cert rotation, none of which a
# hand-written StatefulSet does.
#
#   kubectl create -f https://strimzi.io/install/latest?namespace=jobqueue
#
# The honest limitation here: one broker means replication factor 1, so a
# broker loss is data loss. Kafka's durability story is entirely about
# replication across brokers - min.insync.replicas, acks=all and RF>=3
# together. With RF=1, acks=all is only as safe as acks=1.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: jobqueue
  labels:
    app.kubernetes.io/name: kafka
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: plaintext
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: jobqueue
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      # Kafka is slow to shut down cleanly; rushing it risks unflushed
      # segments and a long recovery on restart.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # uid 1000 (appuser) in the official apache/kafka image.
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: kafka
          # The official Apache image. bitnami/kafka was the common choice
          # until Bitnami restructured their registry and the old tags
          # stopped resolving - a good argument for pinning to a publisher
          # you expect to still be there.
          image: apache/kafka:3.9.0
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "0"
            - name: KAFKA_PROCESS_ROLES
              value: "controller,broker"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka.jobqueue.svc.cluster.local:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # Advertised listeners must be an address the *client* can reach:
            # the first connection only discovers the cluster, and the client
            # then reconnects to whatever address the broker advertises.
            # Inside the cluster that is the pod's stable StatefulSet DNS
            # name, which is exactly why Kafka needs a StatefulSet and a
            # headless Service rather than a Deployment.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-0.kafka.jobqueue.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: plaintext
            initialDelaySeconds: 60
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
