apiVersion: v1
kind: ConfigMap
metadata:
  name: jobqueue-config
  namespace: jobqueue
data:
  # redis.jobqueue.svc.cluster.local, shortened: Services are resolvable by
  # name inside their own namespace.
  REDIS_URL: "redis://redis:6379/0"
  METRICS_ADDR: ":2112"

  # Kafka is optional. Unset these and the queue runs exactly as before,
  # with event publishing disabled - the event stream is observability, not
  # the critical path.
  KAFKA_BROKERS: "kafka-0.kafka.jobqueue.svc.cluster.local:9092"
  KAFKA_TOPIC: "job-events"

  WORKER_COUNT: "3"

  # SHUTDOWN_TIMEOUT must stay BELOW the Pod's terminationGracePeriodSeconds.
  # Kubernetes sends SIGTERM, waits the grace period, then SIGKILLs. If the
  # app's own deadline were the longer of the two it would never get to run:
  # the kernel would kill the process mid-job and the sweeper would have to
  # clean up what should have been a clean drain.
  SHUTDOWN_TIMEOUT: "25s"

  VISIBILITY_TIMEOUT: "15s"
  HEARTBEAT_INTERVAL: "5s"
  SWEEP_INTERVAL: "3s"
  BLOCK_TIMEOUT: "15s"
  DEPTH_POLL_INTERVAL: "5s"

  MAX_ATTEMPTS: "3"
  BASE_RETRY_DELAY: "1s"
  MAX_RETRY_DELAY: "5m"
  PROMOTE_INTERVAL: "1s"
