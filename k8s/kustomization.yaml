apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jobqueue

resources:
  - 00-namespace.yaml
  - 01-config.yaml
  - 02-redis.yaml
  - 03-consumer.yaml
  - 05-scaling.yaml
  - 07-kafka.yaml
  - 08-postgres.yaml
  - 09-auditor.yaml
  # 04-producer-job.yaml is left out on purpose: a Job is a one-off, and
  # including it would make every `kubectl apply -k` try to recreate an
  # immutable, already-completed object. Apply it directly when you want a
  # batch.
  #
  # 06-monitoring.yaml is left out because ServiceMonitor and PrometheusRule
  # are CRDs from the Prometheus Operator. Apply it once that is installed.

# Not commonLabels: that also injects the label into every selector, and
# selectors on Deployments and StatefulSets are immutable. Adding or changing
# a common label later would then be rejected for every existing workload -
# which is exactly what happened the first time this was applied over objects
# created without it. includeSelectors: false keeps it on metadata only.
labels:
  - pairs:
      app.kubernetes.io/part-of: jobqueue
    includeSelectors: false

images:
  - name: jobqueue
    newTag: dev
