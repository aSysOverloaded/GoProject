name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # The reason this workflow earns its keep. The race detector needs cgo
      # and a 64-bit gcc, which is not available on the Windows machine this
      # project is developed on - so this is the only place the worker pool,
      # the per-job heartbeat goroutines, the sweeper and the promoter are
      # ever checked for data races.
      - name: Test with race detector
        run: go test -race -count=1 ./...

      # Run the concurrency-sensitive tests repeatedly. They coordinate real
      # goroutines against timers, so a flake that shows up 1 run in 20 is
      # exactly the kind of bug worth catching before it lands.
      - name: Re-run concurrency tests to catch flakes
        run: go test -race -count=5 -run 'Heartbeat|Sweeper|Reclaim|Promoter|Crash' ./cmd/consumer/

  integration:
    runs-on: ubuntu-latest
    services:
      # The unit tests use miniredis, which is a reimplementation of Redis
      # rather than Redis itself. This job runs the real consumer and producer
      # against the real server, so a behavioural difference cannot hide.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The same script you can run locally, so CI and a laptop check exactly
      # the same thing. It waits on counters, not the sampled depth gauges:
      # the earlier inline version read the gauges, was fooled by the sample
      # taken at startup before any job existed, and failed on every run.
      - name: Smoke test against real Redis
        env:
          REDIS_URL: redis://localhost:6379/0
        run: bash scripts/smoke-test.sh
