# Local observability stack for the job queue.
#
#   docker compose up -d
#
# Then run the queue against it from the host:
#   KAFKA_BROKERS=localhost:9092 go run ./cmd/consumer   (metrics on :2112)
#   go run ./cmd/auditor                                 (Kafka -> Postgres)
#   go run ./cmd/producer                                (enqueues jobs)
#
# Kafka is optional: leave KAFKA_BROKERS unset and the queue runs exactly as
# it did before, with event publishing disabled.
#
#   Grafana     http://localhost:3000   (admin / admin)
#   Prometheus  http://localhost:9090
#   Kafka UI    http://localhost:8080   (topics, messages, consumer lag)
#   Redis       localhost:6379
#   Kafka       localhost:9092
#   Postgres    localhost:5433          (postgres / postgres, db jobqueue)
#
# Postgres is on 5433 to avoid clashing with a locally installed PostgreSQL
# service, which usually owns 5432:
#   DATABASE_URL=postgres://postgres:postgres@localhost:5433/jobqueue?sslmode=disable

services:
  redis:
    image: redis:7-alpine
    container_name: jobqueue-redis
    ports:
      - "6379:6379"
    # appendonly keeps the queue across restarts, which matters when the
    # whole point of the project is not losing jobs.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Kafka in KRaft mode: no ZooKeeper. Modern Kafka runs its own consensus,
  # so the two-container setup you will see in older tutorials is obsolete.
  kafka:
    image: apache/kafka:3.9.0
    container_name: jobqueue-kafka
    ports:
      - "9092:9092"
    environment:
      # This node is both controller and broker - fine locally, never in
      # production, where those roles are separated.
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"

      # Two client listeners, and this is the single most common thing
      # people get wrong about Kafka networking.
      #
      # A client's first connection is only to discover the cluster; the
      # broker replies with its ADVERTISED address and the client reconnects
      # to that. So the advertised address must be reachable *from the
      # client*, not from the broker. A container reaches Kafka at
      # "kafka", the host reaches it at "localhost" - one address cannot be
      # both, which is why there are two listeners on two ports.
      KAFKA_LISTENERS: "CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # One broker cannot replicate to itself, so everything is RF=1 here.
      # In a real cluster these would be 3, and that difference is the whole
      # durability story: with RF=1 a broker loss is data loss, and acks=all
      # is only as safe as acks=1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      # Keep a week of events. This retention window is what makes replay
      # possible, and it is the main thing Redis cannot offer.
      KAFKA_LOG_RETENTION_HOURS: "168"
      # Do not wait the default 3s for more group members to join before
      # rebalancing; locally there is only ever one.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Kafka UI: browse topics, inspect messages, watch consumer group lag.
  # Consumer lag is the number that tells you whether the auditor is keeping
  # up with the producer.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: jobqueue-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # The INTERNAL listener, because kafka-ui is itself a container.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  # Where the auditor archives the event stream.
  postgres:
    image: postgres:16-alpine
    container_name: jobqueue-postgres
    ports:
      # 5433 on the host, not 5432: a locally installed PostgreSQL service
      # commonly already owns 5432, and the clash is silent - you connect
      # successfully to the wrong database and get an authentication error
      # that looks like a config bug. Inside the compose network other
      # containers still use postgres:5432.
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobqueue
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied automatically on first start of an empty data directory.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobqueue"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: jobqueue-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Lets you POST to /-/reload after editing prometheus.yml instead of
      # restarting the container.
      - --web.enable-lifecycle
    extra_hosts:
      # Docker Desktop provides this automatically; declaring it keeps the
      # file working on plain Linux Docker too.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: jobqueue-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Local-only stack, so skip the login screen.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      # Provisioning means the datasource and dashboard exist on first boot;
      # nothing has to be clicked together by hand, and the dashboard is
      # version controlled like the rest of the project.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  kafka-data:
  postgres-data:
